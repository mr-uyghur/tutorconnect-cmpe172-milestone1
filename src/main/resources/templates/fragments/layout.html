<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title th:text="${title} + ' - TutorConnect'">TutorConnect</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark bg-dark mb-4">
 <div class="container">
  <a class="navbar-brand" th:href="@{/}">TutorConnect</a>
  <ul class="navbar-nav me-auto">
   <li class="nav-item"><a class="nav-link" th:href="@{/slots}">Browse slots</a></li>
   <li class="nav-item" sec:authorize="hasRole('CUSTOMER')"><a class="nav-link" th:href="@{/appointments}">My appointments</a></li>
   <li class="nav-item" sec:authorize="hasRole('PROVIDER')"><a class="nav-link" th:href="@{/provider/slots}">My slots</a></li>
   <li class="nav-item" sec:authorize="hasRole('PROVIDER')"><a class="nav-link" th:href="@{/provider/appointments}">My bookings</a></li>
  </ul>
  <span sec:authorize="isAnonymous()"><a class="btn btn-outline-light btn-sm" th:href="@{/login}">Sign in</a></span>
  <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-flex align-items-center gap-2 mb-0">
   <span class="navbar-text small" sec:authentication="principal.fullName">user</span>
   <button class="btn btn-outline-light btn-sm" type="submit">Sign out</button>
  </form>
 </div>
</nav>
</body>
</html>
