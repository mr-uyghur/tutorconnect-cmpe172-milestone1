<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Assistant')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 760px">
 <meta name="csrf-header" th:content="${_csrf.headerName}">
 <meta name="csrf-token" th:content="${_csrf.token}">
 <h1 class="h3">Booking assistant</h1>
 <p class="text-muted small">Ask me to find slots, book or cancel a session, or explain a policy. I always ask before booking or cancelling.</p>
 <div id="log" class="border rounded p-3 mb-3 bg-light" style="height: 420px; overflow-y: auto"></div>
 <form id="chat" class="d-flex gap-2 mb-4">
  <input id="msg" class="form-control" maxlength="2000" autocomplete="off" placeholder="e.g. Find the earliest Java slot this week and book it" required>
  <button class="btn btn-primary" type="submit">Send</button>
  <button class="btn btn-outline-secondary" type="button" id="reset" title="Start a new conversation">New</button>
 </form>
 <h2 class="h5">Policy Q&amp;A (grounded)</h2>
 <form id="ask" class="d-flex gap-2 mb-2">
  <input id="q" class="form-control" maxlength="1000" placeholder="e.g. What is the cancellation policy?" required>
  <button class="btn btn-outline-primary" type="submit">Ask</button>
 </form>
 <div id="answer" class="small"></div>
</main>
<script>
 const header = document.querySelector('meta[name=csrf-header]').content;
 const token = document.querySelector('meta[name=csrf-token]').content;
 const log = document.getElementById('log');
 let conversationId = crypto.randomUUID();

 function add(who, text, cls) {
  const div = document.createElement('div');
  div.className = 'mb-2 ' + (cls || '');
  const b = document.createElement('strong'); b.textContent = who + ': ';
  const span = document.createElement('span'); span.style.whiteSpace = 'pre-wrap'; span.textContent = text;
  div.append(b, span); log.append(div); log.scrollTop = log.scrollHeight;
 }
 async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', [header]: token }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || ('HTTP ' + res.status));
  return data;
 }
 document.getElementById('chat').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('msg'); const text = input.value.trim(); if (!text) return;
  input.value = ''; add('You', text);
  const btns = e.target.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
  try { const r = await post('/api/agent/chat', { conversationId, message: text }); add('Assistant', r.reply); }
  catch (err) { add('Error', err.message, 'text-danger'); }
  finally { btns.forEach(b => b.disabled = false); input.focus(); }
 });
 document.getElementById('reset').addEventListener('click', () => { conversationId = crypto.randomUUID(); log.innerHTML = ''; });
 document.getElementById('ask').addEventListener('submit', async e => {
  e.preventDefault();
  const out = document.getElementById('answer'); out.textContent = 'Thinking...';
  try {
   const r = await post('/api/ask', { question: document.getElementById('q').value });
   out.textContent = r.answer + '\n\nSources: ' + r.sources.join(', ');
   out.style.whiteSpace = 'pre-wrap';
  } catch (err) { out.textContent = err.message; }
 });
</script>
</body>
</html>
