<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width:420px">
 <h1 class="h3 mb-3">Sign in</h1>
 <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
 <div class="alert alert-success" th:if="${param.logout}">You have been signed out.</div>
 <form th:action="@{/login}" method="post">
  <div class="mb-3"><label class="form-label" for="username">Email</label><input class="form-control" id="username" name="username" type="email" required autofocus></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div>
  <button class="btn btn-primary" type="submit">Sign in</button>
 </form>
</main>
</body>
</html>
