<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My appointments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
 <div class="alert alert-success" th:if="${notice}" th:text="${notice}"></div>
 <h1 class="h3">Upcoming</h1>
 <p class="text-muted" th:if="${appts.upcoming.isEmpty()}">Nothing booked yet.</p>
 <table class="table align-middle" th:unless="${appts.upcoming.isEmpty()}">
  <thead><tr><th>Tutor</th><th>Subject</th><th>When</th><th></th></tr></thead>
  <tbody><tr th:each="a : ${appts.upcoming}">
   <td th:text="${a.providerName}"></td><td th:text="${a.serviceName}"></td>
   <td th:text="${#temporals.format(a.startsAt,'EEE, MMM d, h:mm a')}"></td>
   <td class="text-end"><form th:action="@{/appointments/{id}/cancel(id=${a.id})}" method="post" class="mb-0"><button class="btn btn-sm btn-outline-danger" type="submit">Cancel</button></form></td></tr></tbody>
 </table>
 <h2 class="h4 mt-4">History</h2>
 <p class="text-muted" th:if="${appts.history.isEmpty()}">No past appointments.</p>
 <table class="table" th:unless="${appts.history.isEmpty()}">
  <thead><tr><th>Tutor</th><th>Subject</th><th>When</th><th>Status</th></tr></thead>
  <tbody><tr th:each="a : ${appts.history}">
   <td th:text="${a.providerName}"></td><td th:text="${a.serviceName}"></td>
   <td th:text="${#temporals.format(a.startsAt,'EEE, MMM d, h:mm a')}"></td>
   <td><span class="badge" th:classappend="${a.status == 'COMPLETED'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${a.status}"></span></td></tr></tbody>
 </table>
</main>
</body>
</html>
