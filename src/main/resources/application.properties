spring.application.name=tutorconnect
spring.datasource.url=${TUTORCONNECT_DB_URL:jdbc:sqlite:tutorconnect.db}
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never
server.address=127.0.0.1
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
spring.thymeleaf.cache=false

# Ops endpoints: GET /health (includes the database check) and GET /metrics
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Notification service (mock external system) called through NotificationGateway
notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:${server.port}/external/notifications}
notification.connect-timeout=500ms
notification.read-timeout=1s
notification.max-attempts=3
notification.backoff=200ms
# Shared secret the gateway sends and the mock service requires (header X-Notification-Key)
notification.api-key=${NOTIFICATION_API_KEY:dev-only-notification-key}

# Milestone 4: Spring AI + Gemini API (Google AI Studio free tier).
# The key comes from the environment only (GEMINI_API_KEY); it is never committed. Only api-key is set:
# setting project-id or location would switch Spring AI to Vertex AI mode, which rejects an AI Studio key.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

# Agent 2 (autonomous reminders): runs at minute 0 of every hour; "-" disables the schedule (tests).
tutorconnect.agent.reminder.cron=${REMINDER_CRON:0 0 * * * *}
tutorconnect.agent.reminder.window=24h
# RAG: embed the knowledge file into the in-memory vector store when the app starts.
tutorconnect.rag.ingest-on-startup=true
tutorconnect.rag.top-k=4
