spring.application.name=tutorconnect
spring.datasource.url=${TUTORCONNECT_DB_URL:jdbc:sqlite:tutorconnect.db}
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never
server.address=127.0.0.1
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
spring.thymeleaf.cache=false

# Ops endpoints: GET /health (includes the database check) and GET /metrics
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Notification service (mock external system) called through NotificationGateway
notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:${server.port}/external/notifications}
notification.connect-timeout=500ms
notification.read-timeout=1s
notification.max-attempts=3
notification.backoff=200ms
# Shared secret the gateway sends and the mock service requires (header X-Notification-Key)
notification.api-key=${NOTIFICATION_API_KEY:dev-only-notification-key}
