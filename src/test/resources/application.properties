spring.application.name=tutorconnect-test
spring.datasource.url=jdbc:sqlite:target/tutorconnect-tests.db
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Notification gateway: closed port by default; integration tests point it at their own server
notification.base-url=http://127.0.0.1:1/external/notifications
notification.api-key=test-key
notification.connect-timeout=200ms
notification.read-timeout=300ms
notification.max-attempts=2
notification.backoff=10ms
notification.mock.slow-delay=1s

# Ops endpoints, same as the main config
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Milestone 4: tests never call Gemini. A placeholder key lets the context start; AI tests swap in fake models.
spring.ai.google.genai.api-key=test-placeholder-key
spring.ai.google.genai.embedding.api-key=test-placeholder-key
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
tutorconnect.agent.reminder.cron=-
tutorconnect.agent.reminder.window=24h
tutorconnect.rag.ingest-on-startup=false
tutorconnect.rag.top-k=4
