<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1100" width="2000" height="1100" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#37474f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#00796b"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c62828"/></marker>
</defs>
<rect width="2000" height="1100" fill="#fff"/>
<text x="40" y="52" font-size="32" font-weight="700" fill="#1a237e">TutorConnect — Milestone 3 Distribution Diagram</text>
<text x="40" y="84" font-size="19" fill="#546e7a">Client → Appointment Scheduler → Notification Service (commit first, then notify over HTTP/JSON)</text>

<!-- Client -->
<rect x="40" y="190" width="260" height="140" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<text x="170" y="232" font-size="24" font-weight="700" text-anchor="middle" fill="#0d47a1">Client</text>
<text x="170" y="262" font-size="18" text-anchor="middle" fill="#263238">Web browser (student)</text>
<text x="170" y="288" font-size="16" text-anchor="middle" fill="#455a64">Thymeleaf pages · /api JSON</text>
<text x="170" y="312" font-size="16" text-anchor="middle" fill="#455a64">HTTP :8080</text>
<rect x="40" y="370" width="260" height="190" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
<text x="56" y="400" font-size="17" font-weight="700" fill="#263238">Triggers</text>
<text x="56" y="430" font-size="16" fill="#263238"><tspan font-weight="700">Book:</tspan> POST /slots/{id}/book</text>
<text x="56" y="458" font-size="16" fill="#263238"><tspan font-weight="700">Cancel:</tspan></text>
<text x="56" y="482" font-size="16" fill="#263238">POST /appointments/{id}/cancel</text>
<text x="56" y="518" font-size="15" fill="#455a64">Redirect returns right after</text>
<text x="56" y="540" font-size="15" fill="#455a64">commit; never waits on notify.</text>

<!-- Scheduler -->
<rect x="340" y="150" width="1000" height="700" rx="16" fill="#f1f8e9" stroke="#33691e" stroke-width="3"/>
<text x="362" y="184" font-size="24" font-weight="700" fill="#1b5e20">Appointment Scheduler</text>
<text x="1320" y="184" font-size="16" text-anchor="end" fill="#558b2f">TutorConnect Spring Boot app</text>

<rect x="370" y="210" width="200" height="100" rx="10" fill="#fff" stroke="#37474f" stroke-width="2"/>
<text x="470" y="252" font-size="18" font-weight="700" text-anchor="middle" fill="#263238">WebController</text>
<text x="470" y="276" font-size="18" font-weight="700" text-anchor="middle" fill="#263238">/ ApiController</text>
<text x="470" y="298" font-size="14" text-anchor="middle" fill="#607d8b">HTTP layer</text>
<rect x="630" y="210" width="180" height="100" rx="10" fill="#fff" stroke="#37474f" stroke-width="2"/>
<text x="720" y="252" font-size="18" font-weight="700" text-anchor="middle" fill="#263238">BookingService</text>
<text x="720" y="278" font-size="14" text-anchor="middle" fill="#607d8b">book() · cancel()</text>
<text x="720" y="298" font-size="14" text-anchor="middle" fill="#607d8b">optimistic retry</text>
<rect x="870" y="210" width="240" height="100" rx="10" fill="#fff" stroke="#37474f" stroke-width="2"/>
<text x="990" y="252" font-size="18" font-weight="700" text-anchor="middle" fill="#263238">BookingTransaction</text>
<text x="990" y="278" font-size="14" text-anchor="middle" fill="#607d8b">bookOnce() · @Transactional</text>
<text x="990" y="298" font-size="14" text-anchor="middle" fill="#607d8b">SERIALIZABLE</text>
<!-- SQLite cylinder -->
<path d="M1190,225v70a55,14 0 0 0 110,0v-70" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
<ellipse cx="1245" cy="225" rx="55" ry="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
<text x="1245" y="270" font-size="18" font-weight="700" text-anchor="middle" fill="#6d4c00">SQLite</text>
<text x="1245" y="330" font-size="16" font-weight="700" text-anchor="middle" fill="#37474f">① Commit booking</text>
<text x="1245" y="352" font-size="15" text-anchor="middle" fill="#37474f">(DB transaction)</text>
<line x1="300" y1="260" x2="368" y2="260" stroke="#37474f" stroke-width="2.5" marker-end="url(#aK)"/>
<line x1="570" y1="260" x2="628" y2="260" stroke="#37474f" stroke-width="2.5" marker-end="url(#aK)"/>
<line x1="810" y1="260" x2="868" y2="260" stroke="#37474f" stroke-width="2.5" marker-end="url(#aK)"/>
<line x1="1110" y1="260" x2="1187" y2="260" stroke="#37474f" stroke-width="2.5" marker-end="url(#aK)"/>
<text x="720" y="340" font-size="14" text-anchor="middle" fill="#37474f">cancel() publishes CANCELLED</text>
<line x1="720" y1="312" x2="720" y2="324" stroke="#90a4ae" stroke-width="1.5"/>

<!-- async chain -->
<line x1="990" y1="310" x2="990" y2="388" stroke="#00796b" stroke-width="2.5" marker-end="url(#aT)"/>
<text x="1006" y="345" font-size="15" fill="#00695c">publishes BOOKED</text>
<rect x="840" y="392" width="300" height="56" rx="28" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
<text x="990" y="418" font-size="17" font-weight="700" text-anchor="middle" fill="#004d40">AppointmentEvent</text>
<text x="990" y="438" font-size="14" text-anchor="middle" fill="#004d40">{appointmentId, BOOKED / CANCELLED}</text>
<line x1="990" y1="448" x2="990" y2="508" stroke="#00796b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aT)"/>
<text x="1006" y="474" font-size="16" font-weight="700" fill="#00695c">② Then notify</text>
<text x="1006" y="494" font-size="14" fill="#00695c">AFTER_COMMIT, async (rollback ⇒ nothing)</text>
<rect x="870" y="512" width="240" height="110" rx="10" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="990" y="544" font-size="18" font-weight="700" text-anchor="middle" fill="#263238">NotificationListener</text>
<text x="990" y="570" font-size="15" text-anchor="middle" fill="#455a64">@Async("notificationExecutor")</text>
<text x="990" y="592" font-size="12.5" text-anchor="middle" fill="#455a64">notify-* pool (core 2, max 4, queue 100)</text>
<text x="990" y="612" font-size="14" text-anchor="middle" fill="#607d8b">builds NotificationRequest</text>
<line x1="990" y1="622" x2="990" y2="688" stroke="#00796b" stroke-width="2.5" marker-end="url(#aT)"/>
<text x="1006" y="660" font-size="15" fill="#00695c">gateway.send(request)</text>
<rect x="870" y="692" width="240" height="116" rx="10" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="990" y="724" font-size="18" font-weight="700" text-anchor="middle" fill="#263238">NotificationGateway</text>
<text x="990" y="748" font-size="14" text-anchor="middle" fill="#607d8b">interface — never throws</text>
<text x="990" y="776" font-size="17" font-weight="700" text-anchor="middle" fill="#263238">HttpNotificationGateway</text>
<text x="990" y="798" font-size="14" text-anchor="middle" fill="#607d8b">RestClient + retry loop</text>

<!-- why after commit card -->
<rect x="370" y="390" width="460" height="86" rx="10" fill="#fff" stroke="#80cbc4" stroke-width="1.5"/>
<text x="386" y="418" font-size="16" font-weight="700" fill="#00695c">Commit-then-notify</text>
<text x="386" y="443" font-size="15" fill="#37474f">Listener runs only after the booking/cancel commits;</text>
<text x="386" y="464" font-size="15" fill="#37474f">a slow or down service never delays the response.</text>
<!-- rules card -->
<rect x="370" y="512" width="460" height="318" rx="10" fill="#fff" stroke="#c62828" stroke-width="2"/>
<text x="386" y="542" font-size="18" font-weight="700" fill="#b71c1c">Remote-call rules (HttpNotificationGateway)</text>
<g font-size="15.5" fill="#263238">
<text x="386" y="576"><tspan font-weight="700">Coarse-grained:</tspan> one call, whole DTO</text>
<text x="400" y="597" font-size="14.5" fill="#455a64">{idempotencyKey, recipient, type, message, appointmentId}</text>
<text x="386" y="633"><tspan font-weight="700">Timeout:</tspan> connect 500 ms / read 1 s</text>
<text x="386" y="669"><tspan font-weight="700">Retry:</tspan> up to 3 attempts, backoff 200 ms × 2ⁿ⁻¹,</text>
<text x="400" y="690" font-size="14.5" fill="#455a64">on 5xx / timeout / I/O error (other 4xx is final)</text>
<text x="386" y="726"><tspan font-weight="700">Fallback:</tspan> log ERROR + metric,</text>
<text x="400" y="747" font-size="14.5" fill="#455a64">booking still succeeds</text>
<text x="386" y="783"><tspan font-weight="700">Idempotent:</tspan> key</text>
<text x="400" y="804" font-size="14.5" fill="#455a64">appointment-{id}-{BOOKED / CANCELLED}</text>
</g>
<line x1="830" y1="750" x2="868" y2="750" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- boundary -->
<line x1="1385" y1="120" x2="1385" y2="1060" stroke="#c62828" stroke-width="3.5" stroke-dasharray="16 10"/>
<rect x="1060" y="104" width="650" height="38" rx="19" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="1385" y="130" font-size="19" font-weight="700" text-anchor="middle" fill="#b71c1c">Distribution boundary — HTTP/JSON, remote call</text>

<!-- remote call -->
<line x1="1110" y1="750" x2="1676" y2="750" stroke="#c62828" stroke-width="4" marker-end="url(#aR)"/>
<text x="1400" y="696" font-size="16" font-weight="700" fill="#b71c1c">HTTP POST /external/</text>
<text x="1400" y="716" font-size="16" font-weight="700" fill="#b71c1c">notifications</text>
<text x="1400" y="740" font-size="14.5" fill="#37474f" display="none">x</text>
<text x="1400" y="778" font-size="14.5" fill="#37474f">Header: X-Notification-Key</text>
<text x="1400" y="798" font-size="14.5" fill="#37474f">Body: NotificationRequest (JSON)</text>

<!-- Notification service -->
<rect x="1680" y="560" width="300" height="400" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="1830" y="598" font-size="24" font-weight="700" text-anchor="middle" fill="#bf360c">Notification Service</text>
<text x="1830" y="624" font-size="16" text-anchor="middle" fill="#8d4a1f">mock external system</text>
<rect x="1700" y="650" width="260" height="100" rx="10" fill="#fff" stroke="#e65100" stroke-width="2"/>
<text x="1830" y="682" font-size="17" font-weight="700" text-anchor="middle" fill="#263238">NotificationServiceController</text>
<text x="1830" y="710" font-size="15" text-anchor="middle" fill="#455a64">POST /external/notifications</text>
<text x="1830" y="734" font-size="14" text-anchor="middle" fill="#607d8b">validates DTO + API key</text>
<g font-size="15" fill="#37474f">
<text x="1700" y="786">• 401 if X-Notification-Key invalid</text>
<text x="1700" y="814">• Dedupes on idempotencyKey:</text>
<text x="1712" y="835">duplicate acknowledged, not re-stored</text>
<text x="1700" y="863">• Replies 200 {accepted, duplicate}</text>
<text x="1700" y="891">• Demo modes: UP · DOWN (503) ·</text>
<text x="1712" y="912">SLOW (&gt; client read timeout)</text>
</g>

<!-- ops -->
<rect x="340" y="890" width="500" height="150" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
<text x="356" y="920" font-size="17" font-weight="700" fill="#263238">Ops endpoints (same app)</text>
<text x="356" y="950" font-size="15.5" fill="#263238"><tspan font-weight="700">GET /health</tspan> — status incl. database check</text>
<text x="356" y="976" font-size="15.5" fill="#263238"><tspan font-weight="700">GET /metrics</tspan> — Micrometer meters:</text>
<text x="372" y="1000" font-size="14.5" fill="#455a64">tutorconnect.bookings{outcome}, tutorconnect.booking.latency</text>
<text x="372" y="1022" font-size="14.5" fill="#455a64">tutorconnect.notifications{result=sent/failed/dropped}, .retries</text>
<!-- legend -->
<rect x="880" y="890" width="460" height="150" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
<text x="896" y="920" font-size="17" font-weight="700" fill="#263238">Legend</text>
<line x1="896" y1="944" x2="956" y2="944" stroke="#37474f" stroke-width="2.5" marker-end="url(#aK)"/>
<text x="970" y="949" font-size="15" fill="#263238">synchronous, inside the request (step ①)</text>
<line x1="896" y1="974" x2="956" y2="974" stroke="#00796b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aT)"/>
<text x="970" y="979" font-size="15" fill="#263238">in-process, after commit, async (step ②)</text>
<line x1="896" y1="1004" x2="956" y2="1004" stroke="#c62828" stroke-width="4" marker-end="url(#aR)"/>
<text x="970" y="1009" font-size="15" fill="#263238">remote call across the boundary</text>
<text x="896" y="1030" font-size="13.5" fill="#607d8b">Both book and cancel follow ① then ②.</text>
</svg>
